<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome-Back</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- slick -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"
    />

    <!-- aos -->
    <link
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
      rel="stylesheet"
    />

    <!-- custom links -->
    <link rel="stylesheet" href="css/style.css?yhguyg" />
    <link rel="stylesheet" href="css/responsive.css?yhguyg" />
  </head>

  <body>
    <!-- header -->
    <header class="nav_hdr">
      <div class="container">
        <nav class="navbar navbar-expand-lg coming-navbar">
          <a class="navbar-brand" href="index.html"
            ><img src="img/logo.png" alt=""
          /></a>
        </nav>
      </div>
    </header>

    <!-- hero-section -->
    <section
      class="launching-soon pos-rev ovr-hdn welcome-back-sec"
      style="background-image: url(img/coming-bg.png)"
    >
      <div class="container">
        <div class="launching-soon-content">
          <h1 data-aos="fade-up" data-aos-duration="1000">
            <span class="bigg-txt grad-txt">Welcome Back</span>
          </h1>

          <p data-aos="fade-up" data-aos-duration="1000">
            Sign in to access your M11 Club dashboard, manage your account, and
            enjoy a seamless gaming experience.
          </p>

          <div
            class="coming-input-wrap gradient-brdr1"
            data-aos="zoom-in"
            data-aos-duration="900"
          >
            <input
              type="tel"
              class="coming-input"
              placeholder="Mobile number"
              onkeypress="return event.charCode >= 48 && event.charCode <= 57;"
            />
          </div>

           <div
            class="coming-input-wrap gradient-brdr1"
            data-aos="zoom-in"
            data-aos-duration="900"
          >
            <input
              type="tel"
              class="coming-input"
              placeholder="Enter OTP"
              onkeypress="return event.charCode >= 48 && event.charCode <= 57;"
            />
          </div>
          <a class="coming-submit-btn cta">Sign Up</a>
        </div>
      </div>
      <div class="m11-top-right coming-m11-top-right">
        <img src="img/m11.png" alt="" />
      </div>
    </section>

    <!-- footer -->
    <footer class="foot-sec ovr-hdn pos-rev coming-footer">
      <!-- Bottom Bar -->
      <div class="footer-bottom">
        <div class="container">
          <div class="footer-bottom-inner coming-footer-bottom-inner">
            <div class="coming-social">
              <div
                class="coming-social-media gradient-brdr1 main-gift hover-move"
              >
                <a href="#"><img src="img/instaa.svg" alt="insta" /></a>
              </div>
              <div
                class="coming-social-media gradient-brdr1 main-gift hover-move"
              >
                <a href="#"><img src="img/tik-tok.svg" alt="insta" /></a>
              </div>
            </div>
            <p>&copy; 2026 M11 Club Pty Ltd. All rights reserved.</p>
            <p>
              Trade promotion conducted under permit where required. 18+. T&Cs
              apply.
            </p>
          </div>
        </div>
      </div>
    </footer>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Slick -->
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <!-- AOS -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <!-- Custom -->
    <script src="js/script.js?nocache=fcvvfv "></script>

    <script>
      $(function () {
        AOS.init();
      });
    </script>
  </body>
</html>
