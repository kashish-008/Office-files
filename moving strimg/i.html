<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strip Text Marquee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .strip-hero { position: relative; width: 100%; max-width: 1400px; padding: 0 20px; }
  .strip-hero svg { width: 100%; height: auto; display: block; }
  .strip-text {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    letter-spacing: 0.04em;
    fill: #ffffff;
  }
</style>
</head>
<body>

<div class="strip-hero">
  <svg width="1916" height="641" viewBox="0 0 1916 641" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>

      <linearGradient id="grad" x1="-61" y1="321.516" x2="1941" y2="321.516" gradientUnits="userSpaceOnUse">
        <stop stop-color="#F26D40"/>
        <stop offset="1" stop-color="#EE3F66"/>
      </linearGradient>

      <!-- Canvas bounds mask -->
      <mask id="canvasMask" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="1916" height="641">
        <rect width="1916" height="641" fill="#D9D9D9"/>
      </mask>

      <!--
        Invisible centerline — text rides along this.
        Path goes: bottom-left → (crossing going UP-RIGHT = Strand A)
                   → loop top → (crossing going DOWN-RIGHT = Strand B)
                   → long right sweep
        The crossing is around x:260–390, y:280–440.
        Strand A (over) passes upper-right. Strand B (under) passes lower-right.
      -->
      <path id="stripPath"
        d="M-61 534.822C14.599 487.403 208.064 397.721 348.781 318.861
           C518.364 273.505 652.38 81.2536 477.128 40.0197
           C391.563 31.773 235.176 69.3986 294.144 285.875
           C326.961 432.597 510.013 691.612 979.689 553.892
           C1090.51 517.469 1350.81 407.658 1460.09 346.178
           C1678.12 223.509 1796.67 195.882 1941 242.064"
        fill="none"/>

      <!--
        BRIDGE DECK CLIP
        A diagonal polygon that covers Strand A (the incoming strip from bottom-left,
        going upper-right through the crossing). Ribbon painted here = "bridge deck".
        Text UNDER this gets hidden (Strand B goes under).
        Text OVER this stays on top (Strand A goes over).
        Tweak these 4 points to align with the actual crossing.
      -->
      <!--
        Bridge deck polygon = the Strand-A ribbon band (incoming strip from
        bottom-left going upper-right). This diagonal shape is drawn ON TOP
        of the text at the crossing, so text on Strand B (loop exit) is
        hidden underneath — like a car going through a tunnel/underpass.
      -->
      <clipPath id="bridgeDeck">
        <polygon points="130,470  268,262  402,290  264,498"/>
      </clipPath>

    </defs>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 1 — Full ribbon (background, behind everything)
         ═══════════════════════════════════════════════════════ -->
    <g mask="url(#canvasMask)">
      <path id="ribbon"
        d="M306.435 54.2706C359.165 10.2244 430.376 2.31929 478.591 6.51669L480.869 6.72568L483.493 6.97861L486.06 7.5831C536.936 19.5535 575.486 45.113 591.258 86.1368C606.508 125.803 595.619 167.78 576.34 202.397C538.468 270.398 455.506 334.742 363.684 360.733C363.238 360.982 362.792 361.232 362.346 361.481C388.596 410.029 430.892 460.852 493.325 498.733C590.411 557.641 741.598 588.458 968.125 522.165C1077.41 486.157 1334.53 377.595 1440.96 317.715C1550.96 255.832 1639.14 215.966 1719.81 198.237C1802 180.176 1874.71 185.432 1952.89 210.445L1929.11 284.735C1862.96 263.568 1804.24 259.546 1736.56 274.42C1667.36 289.627 1587.25 324.908 1479.21 385.694C1367.29 448.661 1104.58 559.426 991.867 596.469L991.268 596.666L990.663 596.843C747.842 668.044 572.843 638.217 452.863 565.418C377.551 519.721 326.051 458.352 293.745 398.579C241.871 425.951 187.418 453.453 137.098 478.948C60.9103 517.55 -4.3689 550.864 -40.2773 573.387L-81.7227 507.31C-42.0321 482.414 27.221 447.178 101.845 409.369C154.491 382.695 210.553 354.378 263.199 326.5C260.465 317.691 258.167 309.102 256.285 300.802C224.531 183.411 248.874 102.352 306.435 54.2706ZM470.762 84.1339C433.809 81.1162 386.986 88.6175 356.438 114.134C329.507 136.63 305.288 181.811 331.152 278.849L331.772 281.151L332.008 282.015L332.203 282.889C332.599 284.659 333.022 286.45 333.47 288.261L333.98 287.976L338.704 286.712C414.554 266.425 481.138 213.028 508.195 164.445C521.712 140.175 522.065 123.524 518.453 114.128C515.436 106.281 505.434 92.8141 470.762 84.1339Z"
        fill="url(#grad)"/>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 2 — Single text stream (on top of ribbon everywhere)
         ═══════════════════════════════════════════════════════ -->
    <text class="strip-text" font-size="40" dominant-baseline="middle">
      <textPath id="marquee" href="#stripPath" startOffset="0%">
        We are your trusted local guide, dedicated to showcasing the finest experiences, attractions, restaurants, and events in the area. &#8226;&#160;&#160;&#160;
        We are your trusted local guide, dedicated to showcasing the finest experiences, attractions, restaurants, and events in the area. &#8226;&#160;&#160;&#160;
        We are your trusted local guide, dedicated to showcasing the finest experiences, attractions, restaurants, and events in the area. &#8226;&#160;&#160;&#160;
      </textPath>
    </text>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 3 — Bridge deck
         Ribbon repainted ON TOP of text, clipped to the Strand-A diagonal band.
         Text in the bridge zone is hidden = goes "under the bridge".
         Text on Strand-A (incoming from left) is covered here too, but that
         strand exits the crossing ABOVE this zone so it remains visible.
         ═══════════════════════════════════════════════════════ -->
    <g mask="url(#canvasMask)" clip-path="url(#bridgeDeck)">
      <path
        d="M306.435 54.2706C359.165 10.2244 430.376 2.31929 478.591 6.51669L480.869 6.72568L483.493 6.97861L486.06 7.5831C536.936 19.5535 575.486 45.113 591.258 86.1368C606.508 125.803 595.619 167.78 576.34 202.397C538.468 270.398 455.506 334.742 363.684 360.733C363.238 360.982 362.792 361.232 362.346 361.481C388.596 410.029 430.892 460.852 493.325 498.733C590.411 557.641 741.598 588.458 968.125 522.165C1077.41 486.157 1334.53 377.595 1440.96 317.715C1550.96 255.832 1639.14 215.966 1719.81 198.237C1802 180.176 1874.71 185.432 1952.89 210.445L1929.11 284.735C1862.96 263.568 1804.24 259.546 1736.56 274.42C1667.36 289.627 1587.25 324.908 1479.21 385.694C1367.29 448.661 1104.58 559.426 991.867 596.469L991.268 596.666L990.663 596.843C747.842 668.044 572.843 638.217 452.863 565.418C377.551 519.721 326.051 458.352 293.745 398.579C241.871 425.951 187.418 453.453 137.098 478.948C60.9103 517.55 -4.3689 550.864 -40.2773 573.387L-81.7227 507.31C-42.0321 482.414 27.221 447.178 101.845 409.369C154.491 382.695 210.553 354.378 263.199 326.5C260.465 317.691 258.167 309.102 256.285 300.802C224.531 183.411 248.874 102.352 306.435 54.2706ZM470.762 84.1339C433.809 81.1162 386.986 88.6175 356.438 114.134C329.507 136.63 305.288 181.811 331.152 278.849L331.772 281.151L332.008 282.015L332.203 282.889C332.599 284.659 333.022 286.45 333.47 288.261L333.98 287.976L338.704 286.712C414.554 266.425 481.138 213.028 508.195 164.445C521.712 140.175 522.065 123.524 518.453 114.128C515.436 106.281 505.434 92.8141 470.762 84.1339Z"
        fill="url(#grad)"
      />
    </g>

    <!-- LAYER 4 — Text OVER the bridge
         Drawn AFTER the bridge deck → always visible on top of it.
         This is the crossing text that goes OVER the bridge. -->
    <text class="strip-text" font-size="40" dominant-baseline="middle">
      <textPath id="marqueeOver" href="#stripPath" startOffset="0%">
        We are your trusted local guide, dedicated to showcasing the finest experiences, attractions, restaurants, and events in the area. &#8226;&#160;&#160;&#160;
        We are your trusted local guide, dedicated to showcasing the finest experiences, attractions, restaurants, and events in the area. &#8226;&#160;&#160;&#160;
        We are your trusted local guide, dedicated to showcasing the finest experiences, attractions, restaurants, and events in the area. &#8226;&#160;&#160;&#160;
      </textPath>
    </text>

  </svg>
</div>

<script>
  (function () {
    var tp   = document.getElementById('marquee');
    var tpO  = document.getElementById('marqueeOver');
    var offset = 0;
    var speed  = 0.05;
    function tick() {
      offset -= speed;
      if (offset <= -100) offset = 0;
      tp.setAttribute('startOffset',  offset + '%');
      tpO.setAttribute('startOffset', offset + '%');
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
