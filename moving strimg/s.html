<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where to Eat</title>

    <!-- swiper css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- font awesome (icons) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="eat-section">
      <h2 class="eat-heading">Where to Eat</h2>

      <div class="swiper eat-slider">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img
              src="https://sagmetic.site/2026/cms/do-san-diego/web/assets/general/restaurant-1.png"
              alt="Restaurant 1"
            />
            <p class="slide-caption">Restaurant 1</p>
          </div>

          <div class="swiper-slide">
            <img
              src="https://sagmetic.site/2026/cms/do-san-diego/web/assets/general/restaurant-2.png"
              alt="Restaurant 2"
            />
            <p class="slide-caption">Restaurant 2</p>
          </div>

          <div class="swiper-slide">
            <img
              src="https://sagmetic.site/2026/cms/do-san-diego/web/assets/general/restaurant-3.png"
              alt="Restaurant 3"
            />
            <p class="slide-caption">Restaurant 3</p>
          </div>

          <div class="swiper-slide">
            <img
              src="https://sagmetic.site/2026/cms/do-san-diego/web/assets/general/restaurant-1.png"
              alt="Restaurant 4"
            />
            <p class="slide-caption">Restaurant 4</p>
          </div>

          <div class="swiper-slide">
            <img
              src="https://sagmetic.site/2026/cms/do-san-diego/web/assets/general/restaurant-2.png"
              alt="Restaurant 5"
            />
            <p class="slide-caption">Restaurant 5</p>
          </div>

          <div class="swiper-slide">
            <img
              src="https://sagmetic.site/2026/cms/do-san-diego/web/assets/general/restaurant-3.png"
              alt="Restaurant 6"
            />
            <p class="slide-caption">Restaurant 6</p>
          </div>
        </div>
      </div>

      <!-- progress bar -->
      <div class="progress-bar">
        <div class="bar"></div>
      </div>
    </section>

    <section style="padding: 50px">
      <div class="rating-group">
        <span>4.3</span>

        <div>
          <i class="r-star fas fa-star text-warning"></i>
          <i class="r-star fas fa-star text-warning"></i>
          <i class="r-star fas fa-star text-warning"></i>
          <i class="r-star fas fa-star text-warning"></i>
          <i class="r-star far fa-star text-warning"></i>
        </div>

        <span> (3) </span>
      </div>
    </section>

    <!-- swiper js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
