<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up</title>
  <!-- css-files -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/resetpassword.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- google-fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="reset-outer ad-flex">
    <div class="reset-password-container">
      <div class="reset-main">
        <div class="signup-hd">
          <div class="login-logo">
            <img src="img/logo.svg" alt="logo" />
          </div>
          <div class="sign-txt">
            <p>New to our platform? Sign up now! It only takes a minute.</p>
          </div>
        </div>

        <form action="" class="authorization" id="reset-password">

          <div class="form-group">
            <label for="Name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your Name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>
          <div class="form-group terms-conditions">
            <input type="checkbox" class="checkbox" id="checkbox" name="checkbox" required />
            <label for="checkbox">I accept Terms and Condition</label>
          </div>
          <div class="form-group">
            <button type="submit" class="repassword-btn cta cta-green">
              Create Account
            </button>
          </div>
        </form>

        <div class="or-sign-option">

          <div class="or-text">
            <p>OR sign with</p>
          </div>


          <div class="google-option">
            <a href=""><i class="fa-brands fa-google"></i></a>
          </div>
        </div>
      </div>
      <div class="sing-in-already">I already have an account<a href="#">Sign In</a></div>
    </div>
  </div>
</body>

</html>
